services:
  web:
    image: nginx:1.31-alpine
    restart: unless-stopped
    volumes:
      - ./public:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    labels:
      traefik.enable: "true"
      traefik.http.routers.nginx2root-docs.rule: "Host(`${DOCS_DOMAIN:-docs.example.com}`)"
      traefik.http.routers.nginx2root-docs.entrypoints: websecure
      traefik.http.services.nginx2root-docs.loadbalancer.server.port: "80"
    networks:
      - proxy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

networks:
  proxy:
    external: true
    name: traefik-public
